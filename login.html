<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <title>Sign In | InfoSense</title>
  <meta name="description" content="Sign in to InfoSense with your Google account." />
  <link rel="icon" type="image/png" href="assets/icons/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0f172a', surface: '#1e293b', accent: '#6366f1',
            success: '#22c55e', warning: '#f59e0b', danger: '#ef4444',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-base text-slate-300 font-sans antialiased min-h-screen flex flex-col">
  <div id="progress-bar" role="presentation"></div>

  <!-- Top bar -->
  <header class="glass">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between" aria-label="Main navigation">
      <a href="index.html" class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-accent to-indigo-800 grid place-items-center shadow-lg shadow-accent/30">
          <i class="fa-solid fa-magnifying-glass text-white text-sm" aria-hidden="true"></i>
        </span>
        <span class="font-display font-bold text-xl text-white tracking-tight">Info<span class="text-accent">Sense</span></span>
      </a>
      <a href="index.html" class="text-sm text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-arrow-left mr-1.5 text-xs" aria-hidden="true"></i> Back to Home
      </a>
    </nav>
  </header>

  <!-- Sign-in card -->
  <main class="flex-1 grid place-items-center px-4 py-16 relative overflow-hidden">
    <div class="absolute -top-32 left-1/4 w-96 h-96 bg-accent/20 rounded-full blur-3xl pointer-events-none" aria-hidden="true"></div>

    <div class="relative w-full max-w-md">
      <div class="policy-card text-center !p-8 sm:!p-10">
        <span class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-accent to-indigo-800 grid place-items-center shadow-lg shadow-accent/40 mx-auto mb-6">
          <i class="fa-solid fa-magnifying-glass text-white text-2xl" aria-hidden="true"></i>
        </span>

        <h1 class="font-display text-2xl sm:text-3xl font-bold text-white">Welcome Back</h1>
        <p class="mt-2 text-sm text-slate-400">
          Sign in to manage your account and subscription.
        </p>

        <!-- Error box -->
        <div id="login-error" class="hidden callout callout-warning text-left mt-6" role="alert">
          <i class="fa-solid fa-triangle-exclamation mt-0.5" aria-hidden="true"></i>
          <p id="login-error-text"></p>
        </div>

        <!-- Google button -->
        <button id="google-signin-btn"
                class="mt-8 w-full inline-flex items-center justify-center gap-3 px-6 py-3.5 rounded-xl
                       bg-white text-slate-900 font-semibold text-sm
                       hover:bg-slate-100 transition-all duration-200 hover:-translate-y-0.5
                       shadow-lg disabled:opacity-60 disabled:pointer-events-none">
          <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18A10.97 10.97 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
          </svg>
          <span id="google-signin-text">Continue with Google</span>
        </button>

        <p class="mt-6 text-xs text-slate-500 leading-relaxed">
          By signing in, you agree to our
          <a href="terms.html" class="text-accent hover:underline">Terms &amp; Conditions</a> and
          <a href="privacy.html" class="text-accent hover:underline">Privacy Policy</a>.
        </p>
      </div>

      <p class="mt-6 text-center text-xs text-slate-500">
        <i class="fa-solid fa-lock text-accent mr-1" aria-hidden="true"></i>
        Secured by Google Sign-In — we never see your password.
      </p>
    </div>
  </main>

  <footer class="border-t border-white/10 bg-surface/40 py-6">
    <p class="text-center text-xs text-slate-500">© 2026 Pradeetech. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    (function () {
      "use strict";

      var btn      = document.getElementById("google-signin-btn");
      var btnText  = document.getElementById("google-signin-text");
      var errorBox = document.getElementById("login-error");
      var errorTxt = document.getElementById("login-error-text");

      function showError(msg) {
        errorTxt.textContent = msg;
        errorBox.classList.remove("hidden");
      }

      /* Already signed in? → go to account */
      window.__isAuthListener = function (user) {
        if (user) window.location.replace("account.html");
      };

      btn.addEventListener("click", function () {
        if (!window.InfoSenseAuth) {
          showError("Sign-in is still loading. Please wait a moment and try again.");
          return;
        }
        btn.disabled = true;
        btnText.textContent = "Signing in…";
        errorBox.classList.add("hidden");

        window.InfoSenseAuth.signInWithGoogle().catch(function (err) {
          btn.disabled = false;
          btnText.textContent = "Continue with Google";

          var msg = "Something went wrong. Please try again.";
          if (err && err.code === "auth/popup-closed-by-user") {
            msg = "Sign-in window was closed before finishing.";
          } else if (err && err.code === "auth/unauthorized-domain") {
            msg = "This domain is not authorized in Firebase. Add pradeetech.github.io to Authentication → Settings → Authorized domains.";
          } else if (err && err.code === "auth/operation-not-allowed") {
            msg = "Google Sign-In is not enabled in Firebase Console yet.";
          }
          showError(msg);
        });
      });
    })();
  </script>
</body>
</html>
